<hr style="border:0;border-top:1px solid #eee;margin:24px 0;" />
<p style="font-size:12px;color:#666;line-height:1.4;margin:0;">
  {{company.name}}
  {{#if company.email}} — {{company.email}}{{/if}}
  {{#if company.website}} — {{company.website}}{{/if}}
</p>
{{#if company.legal_notes}}
<p style="font-size:12px;color:#666;line-height:1.4;margin:8px 0 0;">
  {{company.legal_notes}}
</p>
{{/if}}
